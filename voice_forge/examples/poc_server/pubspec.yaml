name: poc_server
description: >-
  voice_forge POC: pure-Dart WebRTC server (loopback transport test) + voice
  agent server (VAD/STT/LLM/TTS). Flutter/web client in ../poc_client.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  opus_codec_dart: ^3.0.5
  web_socket_channel: ^3.0.3
  voice_forge:
    path: ../../packages/voice_forge

# Local override until voice_forge_speech is live on pub.dev (see PUBLISHING.md).
dependency_overrides:
  voice_forge_speech:
    path: ../../packages/voice_forge_speech
