name: voice_forge
resolution: workspace
description: >-
  Minimal voice-agent framework for Dart: WebRTC transport, speech
  (VAD/STT/TTS), LLM interface and the conversation loop — all pure Dart.
version: 0.2.1
repository: https://github.com/iamudesharma/clinicguard

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.0.9
  http: ^1.2.0
  opus_codec_dart: ^3.0.5
  shelf: ^1.4.0
  shelf_web_socket: ^3.0.0
  voice_forge_speech: ^1.13.5
  web_socket_channel: ^3.0.3
  webrtc_dart: ^0.25.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.1 # 1.31.1 pairs with test_api 0.7.12 (flutter_test pin, workspace-wide)

topics:
  - voice
  - webrtc
  - speech
  - llm
  - audio