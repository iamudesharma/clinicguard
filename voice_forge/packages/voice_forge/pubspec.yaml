name: voice_forge
description: >-
  Minimal open-source voice-agent framework for Dart. Server-side WebRTC
  transport, signaling, speech (sherpa-onnx: VAD/STT/TTS), LLM interface,
  and the conversation loop — all pure Dart, <300 MB.
version: 0.2.0
repository: https://github.com/example/voice_forge # TODO: set real repo

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.2.0
  opus_codec_dart: ^3.0.5
  shelf: ^1.4.0
  shelf_web_socket: ^3.0.0
  voice_forge_speech: ^1.13.5
  web_socket_channel: ^3.0.3
  webrtc_dart: ^0.25.3

# Local path override only — voice_forge_speech is published separately;
# drop this override once it is live on pub.dev (see PUBLISHING.md).
dependency_overrides:
  voice_forge_speech:
    path: ../voice_forge_speech

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.2

topics:
  - voice
  - webrtc
  - speech
  - llm
  - audio
