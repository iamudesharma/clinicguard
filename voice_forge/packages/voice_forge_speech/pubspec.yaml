name: voice_forge_speech
description: >-
  Pure-Dart FFI bindings for sherpa-onnx (k2-fsa): Silero VAD, Whisper ASR,
  Piper TTS and more. Flutter-free, server-side build of the official
  sherpa_onnx Dart package (Apache-2.0).
version: 1.13.5+1
repository: https://github.com/iamudesharma/clinicguard

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

topics:
  - speech
  - asr
  - tts
  - vad
  - audio
