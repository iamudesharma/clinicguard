name: voice_forge_speech
resolution: workspace
description: >-
  Pure-Dart FFI bindings for sherpa-onnx (k2-fsa): Silero VAD, Whisper and
  other ASR, Piper TTS, speaker ID, and more. Flutter-free, server-side
  build of the official sherpa_onnx Dart package (Apache-2.0) with a small
  patch that lets the host process inject the loaded native library.
version: 1.13.5
repository: https://github.com/iamudesharma/clinicguard

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

topics:
  - speech
  - asr
  - tts
  - vad
  - audio