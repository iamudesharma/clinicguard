name: sherpa_onnx
description: >
  Vendored pure-Dart core of sherpa-onnx (Apache-2.0, k2-fsa) for server-side
  use in voicepipe. Stripped of the Flutter plugin + platform packages: the
  native libsherpa-onnx-c-api library is loaded by the host process.
  Upstream: https://github.com/k2-fsa/sherpa-onnx/tree/master/flutter/sherpa_onnx
version: 1.13.5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

# DO NOT publish. This is a vendored copy for voicepipe.
publish_to: none
