name: clinicguard_agent
description: >-
  ClinicGuard voice agent on voicepipe: triage prompt, greeting, transcript
  persistence to the Python FastAPI control plane, and a summary event at
  call end. The LiveKit-free replacement for server/agent.py.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.2.0
  opus_codec_dart: ^3.0.5
  voicepipe:
    path: ../../packages/voicepipe
